<script>

const adsList =
document.getElementById("adsList");


function escapeHtml(value) {

return String(value)
.replaceAll("&", "&amp;")
.replaceAll("<", "&lt;")
.replaceAll(">", "&gt;")
.replaceAll('"', "&quot;")
.replaceAll("'", "&#039;");

}


async function loadAds() {

try {

const params =
new URLSearchParams(
window.location.search
);

const category =
params.get("category");


document
.querySelectorAll(".category-link")
.forEach(link => {

link.classList.remove("active");

if (
(link.dataset.category || "") ===
(category || "")
) {

link.classList.add("active");

}

});


const apiUrl =
category
? `/api/ads?category=${encodeURIComponent(category)}`
: "/api/ads";


const response =
await fetch(apiUrl);


if (!response.ok) {

throw new Error(
"Ошибка загрузки объявлений"
);

}


const ads =
await response.json();


if (!ads.length) {

adsList.innerHTML = `

<div class="empty">

<p>
${
category
? "В этой категории пока нет объявлений."
: "Пока нет объявлений."
}
</p>

<a
href="/ads/new"
class="button">

Создать объявление

</a>

</div>

`;

return;

}


adsList.innerHTML =
ads.map(ad => {

const title =
escapeHtml(ad.title);

const city =
escapeHtml(
ad.city || "Украина"
);

const categoryText =
escapeHtml(
ad.category || "Разное"
);

const text =
escapeHtml(
String(ad.body || "")
.replace(/\s+/g, " ")
.slice(0, 280)
);

const date =
new Date(ad.created_at)
.toLocaleDateString("ru-RU");


return `

<a
class="ad-card"
href="/ads/${encodeURIComponent(ad.slug)}">

<div class="ad-card-category">
${categoryText}
</div>

<h2 class="ad-card-title">
${title}
</h2>

<div class="ad-card-city">
📍 ${city}
</div>

<p class="ad-card-text">
${text}
</p>

<div class="ad-card-date">
${date}
</div>

</a>

`;

}).join("");


} catch (error) {

console.error(error);

adsList.innerHTML = `

<div class="empty">

<p>
Не удалось загрузить объявления.
</p>

<button
class="button"
onclick="loadAds()">

Повторить

</button>

</div>

`;

}

}


loadAds();

</script>
