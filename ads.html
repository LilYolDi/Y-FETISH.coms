<script>

const categorySlugs = {

"Он ищет её":
"on-ishchet-eyo",

"Она ищет его":
"ona-ishchet-ego",

"Он ищет его":
"on-ishchet-ego",

"Она ищет её":
"ona-ishchet-eyo",

"Пара ищет его":
"para-ishchet-ego",

"Пара ищет её":
"para-ishchet-eyo",

"Он ищет пару":
"on-ishchet-paru",

"Она ищет пару":
"ona-ishchet-paru",

"Пара ищет пару":
"para-ishchet-paru",

"Госпожа ищет рабов":
"gospozha-ishchet-rabov",

"Рабы ищут госпожу":
"raby-ishchut-gospozhu",

"Господин ищет рабов":
"gospodin-ishchet-rabov",

"Рабы ищут господина":
"raby-ishchut-gospodina",

"Разное":
"raznoe"

};

async function loadAds() {

const container =
document.getElementById("adsList");

try {

const response =
await fetch("/api/ads");

const ads =
await response.json();

if (!ads.length) {

container.innerHTML =
'<div class="empty">Пока нет объявлений.</div>';

return;

}

container.innerHTML =
ads.map(ad => {

const category =
categorySlugs[ad.category] ||
"raznoe";

return `

<article class="ad-card">

<a
class="ad-card-link"
href="/ads/${category}/${encodeURIComponent(ad.slug)}"
>

<h2 class="ad-card-title">
${escapeHtml(ad.title)}
</h2>

<div class="ad-card-city">
📍 ${escapeHtml(ad.city)}
</div>

<div class="ad-card-text">
${escapeHtml(ad.body)}
</div>

<div class="ad-card-date">
${formatDate(ad.created_at)}
</div>

</a>

</article>

`;

}).join("");

} catch (error) {

container.innerHTML =
'<div class="empty">Ошибка загрузки объявлений.</div>';

}

}

function escapeHtml(value) {

return String(value || "")
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");

}

function formatDate(date) {

return new Date(date)
.toLocaleDateString(
"ru-RU",
{
day: "2-digit",
month: "2-digit",
year: "numeric"
}
);

}

loadAds();

</script>
