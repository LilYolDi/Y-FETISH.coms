<!doctype html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Объявления — Y-FETISH</title>

<meta
name="description"
content="Объявления Y-FETISH по городам Украины.">

<link
rel="stylesheet"
href="/style.css">

</head>


<body>


<header>

<a
href="/ads"
class="logo">
Y-FETISH
</a>


<nav>

<a href="/ads">
Объявления
</a>

<a
href="/ads/new"
class="button small">
Создать
</a>

</nav>

</header>


<main class="container">


<div class="ads-top">

<h1>
Объявления
</h1>

</div>


<div
id="adsList"
class="ads-list">

</div>


</main>


<script>

const adsList =
document.getElementById("adsList");


function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")

    .replaceAll("<", "&lt;")

    .replaceAll(">", "&gt;")

    .replaceAll('"', "&quot;")

    .replaceAll("'", "&#039;");

}


async function loadAds() {

  try {

    const response =
      await fetch("/api/ads");


    if (!response.ok) {
      throw new Error(
        "Ошибка загрузки объявлений"
      );
    }


    const ads =
      await response.json();


    if (!ads.length) {

      adsList.innerHTML = `

        <div class="empty">

          <p>
            Пока нет объявлений.
          </p>

          <a
            href="/ads/new"
            class="button">

            Создать первое объявление

          </a>

        </div>

      `;

      return;
    }


    adsList.innerHTML =
      ads.map(ad => {

        const title =
          escapeHtml(ad.title);

        const city =
          escapeHtml(
            ad.city || "Украина"
          );

        const text =
          escapeHtml(
            String(ad.body || "")
              .replace(/\s+/g, " ")
              .slice(0, 280)
          );


        const date =
          new Date(ad.created_at)
            .toLocaleDateString(
              "ru-RU"
            );


        return `

          <a
            class="ad-card"
            href="/ads/${encodeURIComponent(ad.slug)}">


            <h2 class="ad-card-title">

              ${title}

            </h2>


            <div
              class="ad-card-city">

              📍 ${city}

            </div>


            <p
              class="ad-card-text">

              ${text}

            </p>


            <div
              class="ad-card-date">

              ${date}

            </div>


          </a>

        `;

      }).join("");


  } catch (error) {

    console.error(error);


    adsList.innerHTML = `

      <div class="empty">

        <p>
          Не удалось загрузить объявления.
        </p>

        <button
          class="button"
          onclick="loadAds()">

          Повторить

        </button>

      </div>

    `;

  }

}


loadAds();

</script>


</body>

</html>
