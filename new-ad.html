<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Подать объявление — Y-FETISH
</title>

<meta
name="description"
content="Подать объявление на Y-FETISH."
>

<link rel="stylesheet" href="/style.css">

</head>

<body>

<header class="header">

<div class="header-inner">

<a href="/ads" class="logo">
<span class="logo-y">Y</span><span class="logo-fetish">-FETISH</span>
</a>

<a href="/ads" class="header-button">
Все объявления
</a>

</div>

</header>

<main class="container">

<div class="card">

<h1>
Подать объявление
</h1>

<form id="adForm">

<label>

Категория

<select id="category" required>

<option value="">
Выберите категорию
</option>

<option>Он ищет её</option>
<option>Она ищет его</option>
<option>Он ищет его</option>
<option>Она ищет её</option>
<option>Пара ищет его</option>
<option>Пара ищет её</option>
<option>Он ищет пару</option>
<option>Она ищет пару</option>
<option>Пара ищет пару</option>
<option>Госпожа ищет рабов</option>
<option>Рабы ищут госпожу</option>
<option>Господин ищет рабов</option>
<option>Рабы ищут господина</option>
<option>Разное</option>

</select>

</label>

<label>

Город

<select id="city" required>

<option value="">
Выберите город
</option>

<option>Киев</option>
<option>Львов</option>
<option>Одесса</option>
<option>Харьков</option>
<option>Днепр</option>
<option>Запорожье</option>
<option>Винница</option>
<option>Ивано-Франковск</option>
<option>Тернополь</option>
<option>Ужгород</option>
<option>Черновцы</option>
<option>Полтава</option>
<option>Черкассы</option>
<option>Житомир</option>
<option>Хмельницкий</option>
<option>Ровно</option>
<option>Луцк</option>
<option>Николаев</option>
<option>Другой город</option>

</select>

</label>

<label>

Текст объявления

<textarea
id="body"
rows="9"
maxlength="5000"
placeholder="Напишите текст объявления..."
required
></textarea>

</label>

<label>

Telegram

<input
id="telegram"
type="text"
maxlength="32"
placeholder="@username"
required
>

</label>

<div
id="error"
class="form-error"
></div>

<button
type="submit"
class="submit-button"
>
Опубликовать
</button>

</form>

</div>

</main>

<script>

const form =
document.getElementById("adForm");

const errorBox =
document.getElementById("error");

form.addEventListener(
"submit",
async event => {

event.preventDefault();

errorBox.textContent = "";

const category =
document.getElementById("category").value;

const city =
document.getElementById("city").value;

const body =
document.getElementById("body").value.trim();

const telegram =
document.getElementById("telegram").value.trim();

try {

const response =
await fetch(
"/api/ads",
{
method: "POST",

headers: {
"Content-Type":
"application/json"
},

body: JSON.stringify({
category,
city,
body,
telegram
})

}
);

const data =
await response.json();

if (!response.ok) {

throw new Error(
data.error ||
"Ошибка публикации"
);

}

window.location.href =
data.url;

} catch (error) {

errorBox.textContent =
error.message;

}

});

</script>

</body>

</html>
