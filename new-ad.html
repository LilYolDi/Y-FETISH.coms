<!doctype html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>Создать объявление — Y-FETISH</title>

<link
rel="stylesheet"
href="/style.css">

</head>

<body>

<header>

<a
href="/ads"
class="logo">
Y-FETISH
</a>

<nav>

<a href="/ads">
Объявления
</a>

</nav>

</header>


<main class="container">

<section class="card">

<h1>
Создать объявление
</h1>


<form id="adForm">


<label for="category">
Категория
</label>

<select
id="category"
required>

<option value="">
Выберите категорию
</option>

<option>Он ищет её</option>
<option>Она ищет его</option>
<option>Он ищет его</option>
<option>Она ищет её</option>
<option>Пара ищет его</option>
<option>Пара ищет её</option>
<option>Он ищет пару</option>
<option>Она ищет пару</option>
<option>Пара ищет пару</option>
<option>Госпожа ищет рабов</option>
<option>Рабы ищут госпожу</option>
<option>Господин ищет рабов</option>
<option>Рабы ищут господина</option>
<option>Разное</option>

</select>


<label for="city">
Ваш город
</label>

<select
id="city"
required>

<option value="">
Выберите город
</option>

<option>Киев</option>
<option>Львов</option>
<option>Одесса</option>
<option>Харьков</option>
<option>Днепр</option>
<option>Запорожье</option>
<option>Винница</option>
<option>Ивано-Франковск</option>
<option>Тернополь</option>
<option>Ужгород</option>
<option>Черновцы</option>
<option>Полтава</option>
<option>Черкассы</option>
<option>Житомир</option>
<option>Хмельницкий</option>
<option>Ровно</option>
<option>Луцк</option>
<option>Николаев</option>
<option>Другой город</option>

</select>


<label for="body">
Текст объявления
</label>

<textarea
id="body"
maxlength="10000"
placeholder="Напишите текст вашего объявления..."
required></textarea>


<label for="telegram">
Ваш Telegram
</label>

<input
type="text"
id="telegram"
maxlength="100"
placeholder="@username"
required>


<div
id="error"
style="display:none;">
</div>


<button
type="submit"
class="button">

Опубликовать

</button>


</form>

</section>

</main>


<script>

const form =
document.getElementById("adForm");

const error =
document.getElementById("error");


form.addEventListener(
"submit",
async event => {

  event.preventDefault();

  error.style.display = "none";


  const category =
    document
      .getElementById("category")
      .value;

  const city =
    document
      .getElementById("city")
      .value;

  const body =
    document
      .getElementById("body")
      .value
      .trim();

  const telegram =
    document
      .getElementById("telegram")
      .value
      .trim();


  try {

    const response =
      await fetch(
        "/api/ads",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              category,
              city,
              body,
              telegram
            })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Ошибка публикации."
      );

    }


    window.location.href =
      data.url;


  } catch (err) {

    error.textContent =
      err.message;

    error.style.display =
      "block";

  }

});

</script>

</body>

</html>
